[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repocortex"
version = "0.1.0"
description = "Self-improving code graph for bug localization, stored in HydraDB"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "neo4j>=5.26",
    "httpx>=0.27",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "mcp>=1.9",
]

[tool.setuptools.packages.find]
include = ["repocortex*"]
